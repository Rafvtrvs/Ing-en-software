<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa - Orden de Trabajo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2kZk6l18e1v1wqkR2b3qk4G7gqk2v+3u5m5k5xE=" crossorigin=""/>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #info { padding: 12px; }
    #map { height: 60vh; width: 100%; }
    .muted { color: #666; font-size: 0.9em }
  </style>
</head>
<body>
  <div id="info">
    <h3>Ubicación de la Orden</h3>
    <div><strong>ID:</strong> <span id="id">-</span></div>
    <div><strong>Dirección:</strong> <span id="address">-</span></div>
    <div><strong>Coordenadas:</strong> <span id="coords">-</span></div>
    <p class="muted">Si la orden tiene coordenadas se mostrará un marcador en el mapa.</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-QV8g+q1zYdYVx3q8pN6Fv8k6b5z7Qk1gXn1Y2Zk3y0g=" crossorigin=""></script>
  <script>
    // Extraer id desde la URL: /map/orders/:id
    const parts = window.location.pathname.split('/')
    const id = parts[parts.length - 1]
    document.getElementById('id').textContent = id

    async function load() {
      try {
        const res = await fetch(`/api/orders/${encodeURIComponent(id)}`)
        if (!res.ok) throw new Error(`Error cargando orden: ${res.status}`)
        const ot = await res.json()
        document.getElementById('address').textContent = ot.address || '—'
        const lat = ot.latitude
        const lon = ot.longitude
        if (lat !== undefined && lon !== undefined) {
          document.getElementById('coords').textContent = `${lat}, ${lon}`
          const map = L.map('map').setView([lat, lon], 15)
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map)
          L.marker([lat, lon]).addTo(map).bindPopup(ot.address || id).openPopup()
        } else {
          document.getElementById('coords').textContent = 'No disponibles'
          // inicializar mapa centrado en Chile (fallback)
          const map = L.map('map').setView([-33.45, -70.6667], 5)
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map)
        }
      } catch (err) {
        document.getElementById('address').textContent = 'Error cargando orden'
        document.getElementById('coords').textContent = ''
        console.error(err)
      }
    }

    load()
  </script>
</body>
</html>
